<style>
  :root{--paper:#f5f2eb;--ink:#2b2b2b;--accent:#d93832;--teal:#b0dedb;--mute:#8a857c}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#e9e6df;font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans",sans-serif;
       color:var(--ink);padding:48px 40px 80px}
  h1{font-size:30px;font-weight:600;margin-bottom:6px}
  .lead{font-size:15px;color:#6e6a63;margin-bottom:34px;line-height:1.7}
  .chapter{margin:0 0 40px}
  .chead{display:flex;align-items:baseline;gap:14px;margin:0 0 14px;padding:0 4px}
  .chead .no{background:var(--ink);color:#fff;font-size:13px;font-weight:600;padding:5px 12px;border-radius:999px}
  .chead h2{font-size:20px;font-weight:600}
  .chead .sec{font-size:13px;color:#6e6a63}
  .chead .bg{font-size:12px;color:#6e6a63;margin-left:auto}
  .na{background:#fff;border-radius:10px;padding:14px 18px;font-size:15px;line-height:1.8;margin:0 4px 16px}
  .na b{color:var(--accent);font-weight:600;font-size:12px;letter-spacing:.06em;margin-right:10px}
  .panels{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
  .panel{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.06)}
  .frame{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden}
  .meta{padding:11px 13px 13px;font-size:12.5px;line-height:1.65}
  .meta .t{font-weight:600;font-size:12px;color:var(--accent);letter-spacing:.04em}
  .meta .say{margin-top:3px}
  .meta .mv{margin-top:6px;color:#6e6a63;font-size:11.5px}
  /* ---- 画面の中の部品（縮小版） ---- */
  .frame .el{position:absolute}
  .card{background:#fff;border-radius:4px;box-shadow:0 2px 6px rgba(43,43,43,.16)}
  .card .bar{height:12%;border-bottom:1px solid #eee9de}
  .card .ln{position:absolute;left:8%;right:8%;height:6%;border-radius:3px;background:#eceae4}
  .card .btn{position:absolute;height:9%;width:26%;border-radius:99px;background:var(--accent)}
  .badge{border-radius:50%;background:#fff;overflow:hidden;box-shadow:0 2px 6px rgba(43,43,43,.14)}
  .badge img{position:absolute;width:160%;left:-30%;top:-22%}
  .ph{border-radius:50%;background:#efece5;border:2px solid #d9d4c9;
      display:flex;align-items:center;justify-content:center;font-size:9px;color:#8a857c}
  .tag{position:absolute;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
       font-size:8px;padding:2px 7px;border-radius:99px;white-space:nowrap}
  .pill{background:var(--accent);color:#fff;font-size:9px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap}
  .pill.w{background:#fff;color:var(--accent)}
  .pill.k{background:var(--ink);color:#fff}
  .bub{background:#fff;border:1.5px solid var(--ink);border-radius:8px;font-size:9px;font-weight:600;
       padding:3px 8px;white-space:nowrap}
  .lbl{font-size:8.5px;color:var(--ink);white-space:nowrap;text-align:center}
  .head{position:absolute;left:0;right:0;text-align:center;font-size:13px;font-weight:600;letter-spacing:.01em}
  .cap{position:absolute;left:0;right:0;bottom:5%;text-align:center;font-size:9px;font-weight:600}
  .dash{border-top:2px dashed #cfc9bd}
  .dash.r{border-color:var(--accent)}
  .arrowhead{width:0;height:0;border-left:7px solid var(--accent);
             border-top:5px solid transparent;border-bottom:5px solid transparent}
  .chk{border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;
       justify-content:center;font-size:11px}
  .ring{border:2px dashed var(--ink);border-radius:50%;opacity:.55}
  .note{font-size:11px;color:#6e6a63;margin:10px 4px 0;line-height:1.7}
</style>
</head>

    head:'', cap:'まずはお気軽にご相談ください。',

   {t:'0:58–1:00', say:'（無音）', mv:'赤い矢羽が走ってロゴで止まり、CTA が出る。ここだけ生成せず SVG で作る',
    head:'', cap:'',
    els:[{k:'logo',x:30,y:38},{k:'pill',x:32,y:60,txt:'ホームページ制作について相談する'}]}
  ]}
];

// ============ 描画 ============
const board=document.getElementById('board');
function el(k,cls,style,html){const d=document.createElement(k);if(cls)d.className=cls;if(style)d.style.cssText=style;if(html!==undefined)d.innerHTML=html;return d;}
const pc=(v)=>v+'%';

function drawEl(f,e,ch){
  const ink=ch.fg, add=(n)=>f.appendChild(n);
  switch(e.k){
    case 'card':{
      const c=el('div','el card',`left:${pc(e.x)};top:${pc(e.y)};width:${pc(e.w)};height:${pc(e.h)}`);
      c.appendChild(el('div','bar'));
      c.appendChild(el('div','ln','top:24%;width:60%'));
      c.appendChild(el('div','ln','top:38%;width:44%'));
      if(e.btn) c.appendChild(el('div','btn','left:8%;bottom:12%'));
      add(c);break;}
    case 'badge':{
      const w=el('div','el',`left:${pc(e.x)};top:${pc(e.y)};width:${pc(e.d)};aspect-ratio:1`);
      const c=el('div','badge','position:relative;width:100%;height:100%;overflow:hidden');
      const i=el('img');i.src=e.img;c.appendChild(i);w.appendChild(c);
      if(e.tag) w.appendChild(el('div','tag','bottom:-9px',e.tag));
      add(w);break;}
    case 'ph':{
      const w=el('div','el',`left:${pc(e.x)};top:${pc(e.y)};width:${pc(e.d)};aspect-ratio:1`);
      const c=el('div','ph','width:100%;height:100%',e.txt||'');
      w.appendChild(c);
      if(e.tag) w.appendChild(el('div','tag','bottom:-9px',e.tag));
      add(w);break;}
    case 'pill': add(el('div','el pill',`left:${pc(e.x)};top:${pc(e.y)}`,e.txt));break;
    case 'pillw': add(el('div','el pill w',`left:${pc(e.x)};top:${pc(e.y)}`,e.txt));break;
    case 'ktag': add(el('div','el pill k',`left:${pc(e.x)};top:${pc(e.y)};font-weight:600`,e.txt));break;
    case 'wtag': add(el('div','el lbl',`left:${pc(e.x)};top:${pc(e.y)};font-weight:600`,e.txt));break;
    case 'small': add(el('div','el lbl',`left:${pc(e.x)};top:${pc(e.y)};font-size:7px;color:${ink};opacity:.8`,e.txt));break;
    case 'bub': add(el('div','el bub',`left:${pc(e.x)};top:${pc(e.y)}`,e.txt));break;
    case 'dash': add(el('div','el dash',`left:${pc(e.x)};top:${pc(e.y)};width:${pc(e.w)}`));break;
    case 'line': add(el('div','el',`left:${pc(e.x)};top:${pc(e.y)};width:${pc(e.w)};height:2px;background:${ink};opacity:.35`));break;
    case 'rline': add(el('div','el',`left:${pc(e.x)};top:${pc(e.y)};width:${pc(e.w)};height:2px;background:var(--accent)`));break;
    case 'vline': add(el('div','el',`left:${pc(e.x)};top:${pc(e.y)};width:2px;height:9%;background:var(--accent)`));break;
    case 'dot': add(el('div','el',`left:${pc(e.x)};top:${pc(e.y)};width:14px;height:14px;border-radius:50%;background:${e.r?'var(--accent)':'#fff'};border:2px solid ${e.r?'var(--accent)':ink}`));break;
    case 'arrow':{
      const w=el('div','el',`left:${pc(e.x)};top:${pc(e.y)};width:${pc(e.w)};display:flex;align-items:center`);
      w.appendChild(el('div','dash r','flex:1'));
      w.appendChild(el('div','arrowhead'));
      add(w);break;}
    case 'valcard': add(el('div','el',`left:${pc(e.x)};top:${pc(e.y)};width:22px;height:22px;border-radius:5px;background:var(--accent);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center`,'♥'));break;
    case 'memo': add(el('div','el',`left:${pc(e.x)};top:${pc(e.y)};width:16px;height:12px;border-radius:2px;background:var(--accent);opacity:${e.op}`));break;
    case 'x': add(el('div','el',`left:${pc(e.x)};top:${pc(e.y)};width:20px;height:20px;border-radius:50%;background:#fff;color:#b6b0a6;font-size:13px;display:flex;align-items:center;justify-content:center`,'✕'));break;
    case 'chk': add(el('div','el chk',`left:${pc(e.x)};top:${pc(e.y)};width:20px;height:20px`,'✓'));break;
    case 'ring': add(el('div','el ring',`left:${pc(e.x)};top:${pc(e.y)};width:${pc(e.d)};aspect-ratio:1;border-color:${ink}`));break;
    case 'wipe': add(el('div','el',`left:${pc(e.x)};top:0;width:70%;height:100%;background:#fff`));break;
    case 'logo': add(el('div','el',`left:${pc(e.x)};top:${pc(e.y)};color:#fff;font-size:17px;font-weight:800;letter-spacing:.04em`,'<span style="color:#fff">▶</span> RE DESIGN.'));break;
  }
}

CH.forEach(ch=>{
  const sec=el('section','chapter');
  const h=el('div','chead');
  h.appendChild(el('span','no',null,ch.no));
  h.appendChild(el('h2',null,null,ch.title));
  h.appendChild(el('span','sec',null,ch.sec));
  h.appendChild(el('span','bg',null,'背景: '+ch.bg));
  sec.appendChild(h);
  sec.appendChild(el('div','na',null,'<b>ナレーション</b>'+ch.na));
  const g=el('div','panels');
  ch.panels.forEach(p=>{
    const card=el('div','panel');
    const f=el('div','frame',`background:${ch.bg};color:${ch.fg}`);
    if(p.head) f.appendChild(el('div','head',`top:7%;color:${ch.fg}`,p.head));
    p.els.forEach(e=>drawEl(f,e,ch));
    if(p.cap) f.appendChild(el('div','cap',`color:${ch.fg}`,p.cap));
    card.appendChild(f);
    const m=el('div','meta');
    m.appendChild(el('div','t',null,p.t));
    m.appendChild(el('div','say',null,'「'+p.say+'」'));
    m.appendChild(el('div','mv',null,p.mv));
    card.appendChild(m);
    g.appendChild(card);
  });
  sec.appendChild(g);
  board.appendChild(sec);
});
</script>
</body>
</html>
