<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RE DESIGN — メインビジュアル パターンC（墨ステージ・幾何学イラスト）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="tokens.css">
<style>
  /* =====================================================================
     §1 メインビジュアル パターンC — 墨の全画面ステージ＋低彩度パステルの
     幾何学イラスト（参考: Thinking Lab の円形コラージュの型）
     赤はCTAとイラスト内シェブロンの2点。文言は docs/CONTENT.md §1 準拠
     ===================================================================== */
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font-jp);
    color: var(--color-white);
    background: var(--color-ink);
    -webkit-font-smoothing: antialiased;
  }
  img { display: block; }
  a { color: inherit; text-decoration: none; }

  .header {
    position: absolute; inset: 0 0 auto 0; z-index: 30;
    display: flex; align-items: center;
    padding: 22px clamp(20px, 4vw, 48px);
  }
  /* 墨地では白ロゴがないため、シンボル＋テキストで組む */
  .header__logo { display: inline-flex; align-items: center; gap: 12px; }
  .header__logo img { height: 30px; width: auto; }
  .header__logo span {
    font-family: var(--font-en); font-weight: 800; font-size: 17px;
    letter-spacing: .12em; color: var(--color-white);
  }

  .hero {
    position: relative;
    min-height: 100svh;
    overflow: hidden;
    display: flex; align-items: center;
  }

  .hero__inner {
    position: relative; z-index: 10;
    width: 100%;
    max-width: var(--container);
    margin: 0 auto;
    padding: 120px clamp(20px, 4vw, 48px) 96px;
    display: grid;
    grid-template-columns: 1.1fr .9fr;
    gap: clamp(32px, 5vw, 72px);
    align-items: center;
  }

  .hero__copy {
    font-size: clamp(24px, 3.4vw, 44px);
    font-weight: 900;
    line-height: 1.6;
    letter-spacing: .04em;
  }
  .hero__copy span { display: inline-block; }

  .hero__lead {
    text-wrap: pretty;
    margin-top: clamp(20px, 3vh, 30px);
    max-width: 32em;
    font-size: clamp(14px, 1.15vw, 15px);
    line-height: 2;
    color: rgba(255, 255, 255, .78);
    display: grid; gap: .85em;
  }

  /* 赤のCTA（墨地に赤が最も生きる置き方） */
  .hero__cta {
    display: inline-flex; align-items: center; gap: 14px;
    margin-top: clamp(24px, 3.5vh, 36px);
    background: var(--color-logo-red);
    color: var(--color-white);
    font-weight: 700;
    font-size: 15px;
    letter-spacing: .06em;
    padding: 18px 30px;
    border-radius: 999px;
  }
  .hero__cta::after {
    content: ""; width: 9px; height: 12px;
    background: currentColor;
    clip-path: polygon(0 0, 55% 0, 100% 50%, 55% 100%, 0 100%, 45% 50%);
  }
  .hero__cta:hover { background: #c02d28; }
  .hero__cta:focus-visible { outline: 3px solid var(--color-mint); outline-offset: 3px; }

  /* ---- 右: 幾何学イラスト（円形コラージュ） ---- */
  .hero__art {
    position: relative;
    width: min(100%, 480px);
    aspect-ratio: 1;
    margin-inline: auto;
    border-radius: 50%;
    background: #3a3a37;
    overflow: hidden;
  }
  .hero__art i { position: absolute; }
  .hero__art .c  { border-radius: 50%; }
  .hero__art .t  { clip-path: polygon(50% 0, 100% 100%, 0 100%); }
  .hero__art .ch { clip-path: polygon(0 0, 55% 0, 100% 50%, 55% 100%, 0 100%, 45% 50%); }

  .hero__art i:nth-child(1) { width: 34%; height: 34%; left: 52%; top: 48%; background: var(--color-mint); }
  .hero__art i:nth-child(2) { width: 18%; height: 18%; left: 16%; top: 18%; background: var(--color-purple); }
  .hero__art i:nth-child(3) { width: 14%; height: 14%; left: 66%; top: 14%; background: var(--color-cream); transform: rotate(14deg); }
  .hero__art i:nth-child(4) { width: 16%; height: 16%; left: 30%; top: 60%; background: var(--color-cream-deep); transform: rotate(-10deg); }
  .hero__art i:nth-child(5) { width: 20%; height: 22%; left: 12%; top: 40%; background: var(--color-logo-red); }
  .hero__art i:nth-child(6) { width: 13%; height: 13%; left: 46%; top: 24%; background: var(--color-green); }
  .hero__art i:nth-child(7) { width: 12%; height: 12%; left: 76%; top: 66%; background: var(--color-purple); transform: rotate(24deg); }

  /* 画面下端のロゴタイプ（クリームの見切り） */
  .hero__logotype {
    position: absolute; z-index: 5;
    left: 0; right: 0; bottom: -0.32em;
    font-family: var(--font-en);
    font-weight: 800;
    font-size: clamp(72px, 13.5vw, 190px);
    letter-spacing: -.01em;
    line-height: 1;
    white-space: nowrap;
    text-align: center;
    color: var(--color-cream);
    opacity: .1;
    pointer-events: none;
    user-select: none;
  }

  @media (prefers-reduced-motion: no-preference) {
    .hero__copy, .hero__lead, .hero__cta, .hero__art {
      opacity: 0; transform: translateY(18px);
      animation: rise .9s cubic-bezier(.22, 1, .36, 1) forwards;
    }
    .hero__lead { animation-delay: .12s; }
    .hero__cta  { animation-delay: .24s; }
    .hero__art  { animation-delay: .18s; }
    @keyframes rise { to { opacity: 1; transform: none; } }
  }

  @media (max-width: 767px) {
    .hero { min-height: auto; }
    .hero__inner {
      grid-template-columns: 1fr;
      padding: 104px 24px 120px;
      gap: 44px;
    }
    .hero__copy { font-size: clamp(24px, 6.7vw, 32px); }
    .hero__art { width: min(100%, 320px); }
    .hero__logotype { font-size: clamp(56px, 16vw, 80px); }
    .header__logo img { height: 26px; }
  }
</style>
</head>
<body>

<header class="header">
  <a class="header__logo" href="#" aria-label="RE DESIGN">
    <img src="../../assets/logo/logo_symbol.svg" alt="" width="69" height="86">
    <span>RE DESIGN</span>
  </a>
</header>

<section class="hero">
  <div class="hero__inner">
    <div>
      <h1 class="hero__copy">
        <span>ホームページを、</span><br>
        <span>ただつくるだけではない。</span><br>
        <span>事業と集客を、</span><span>ともに考える。</span>
      </h1>
      <div class="hero__lead">
        <p>RE DESIGNは、お客様の事業を理解し、その価値や課題を整理することから始めます。</p>
        <p>誰に、何を伝えるのか。<br>どのような方法で届け、訪れた人をどう問い合わせや商談につなげるのか。</p>
        <p>Web集客全体の流れから逆算し、届けたい人にきちんと伝わるホームページを設計・制作します。</p>
      </div>
      <a class="hero__cta" href="#contact">ホームページ制作について相談する</a>
    </div>

    <div class="hero__art" aria-hidden="true">
      <i class="c"></i><i class="c"></i><i class="t"></i><i></i><i class="ch"></i><i class="c"></i><i class="t"></i>
    </div>
  </div>

  <p class="hero__logotype" aria-hidden="true">RE DESIGN</p>
</section>

</body>
</html>
