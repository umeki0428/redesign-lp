<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RE DESIGN — メインビジュアル パターンB（白基調・整理型）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="tokens.css">
<style>
  /* =====================================================================
     §1 メインビジュアル パターンB — 白基調の整理型＋角丸写真カード
     赤はキーワードとシェブロンの2点。文言は docs/CONTENT.md §1 準拠
     ===================================================================== */
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font-jp);
    color: var(--color-ink);
    background: var(--color-white);
    -webkit-font-smoothing: antialiased;
  }
  img { display: block; }
  a { color: inherit; text-decoration: none; }

  .header {
    position: absolute; inset: 0 0 auto 0; z-index: 30;
    display: flex; align-items: center;
    padding: 22px clamp(20px, 4vw, 48px);
  }
  .header__logo img { height: 34px; width: auto; }

  .hero {
    position: relative;
    min-height: 100svh;
    overflow: hidden;
    display: flex; align-items: center;
  }
  /* 背景: 白地に淡い罫線グリッド */
  .hero::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      linear-gradient(to right, var(--color-line) 1px, transparent 1px),
      linear-gradient(to bottom, var(--color-line) 1px, transparent 1px);
    background-size: 120px 120px;
    opacity: .35;
  }

  .hero__inner {
    position: relative; z-index: 10;
    width: 100%;
    max-width: var(--container);
    margin: 0 auto;
    padding: 120px clamp(20px, 4vw, 48px) 72px;
    display: grid;
    grid-template-columns: 1.05fr .95fr;
    gap: clamp(32px, 5vw, 72px);
    align-items: center;
  }

  /* ---- 左: コピー ---- */
  .hero__chevrons {
    display: flex; gap: 6px; margin-bottom: 26px;
  }
  .hero__chevrons i {
    width: 26px; height: 30px;
    clip-path: polygon(0 0, 55% 0, 100% 50%, 55% 100%, 0 100%, 45% 50%);
  }
  .hero__chevrons i:nth-child(1) { background: var(--color-logo-red); }
  .hero__chevrons i:nth-child(2) { background: var(--color-mint); }
  .hero__chevrons i:nth-child(3) { background: var(--color-cream-deep); }

  .hero__copy {
    font-size: clamp(24px, 3.4vw, 44px);
    font-weight: 900;
    line-height: 1.6;
    letter-spacing: .04em;
  }
  .hero__copy span { display: inline-block; }
  .hero__copy .is-red { color: var(--color-logo-red); }

  .hero__lead {
    text-wrap: pretty;
    margin-top: clamp(20px, 3vh, 30px);
    max-width: 32em;
    font-size: clamp(14px, 1.15vw, 15px);
    line-height: 2;
    color: var(--color-ink-soft);
    display: grid; gap: .85em;
  }

  .hero__cta {
    display: inline-flex; align-items: center; gap: 14px;
    margin-top: clamp(24px, 3.5vh, 36px);
    background: var(--color-ink);
    color: var(--color-white);
    font-weight: 700;
    font-size: 15px;
    letter-spacing: .06em;
    padding: 18px 30px;
    border-radius: 999px;
  }
  .hero__cta::after {
    content: ""; width: 9px; height: 12px;
    background: currentColor;
    clip-path: polygon(0 0, 55% 0, 100% 50%, 55% 100%, 0 100%, 45% 50%);
  }
  .hero__cta:hover { background: var(--color-logo-red); }
  .hero__cta:focus-visible { outline: 3px solid var(--color-logo-red); outline-offset: 3px; }

  /* ---- 右: 写真カード＋色面 ---- */
  .hero__visual { position: relative; }
  /* クリームの色面を背後に敷いてずらす */
  .hero__visual::before {
    content: ""; position: absolute;
    inset: 10% -6% -8% 12%;
    background: var(--color-cream);
    border-radius: var(--radius);
  }
  /* ミントの小面を対角に */
  .hero__visual::after {
    content: ""; position: absolute;
    left: -4%; bottom: -5%;
    width: 34%; height: 26%;
    background: var(--color-mint);
    border-radius: 18px;
    z-index: 2;
  }
  .hero__photo {
    position: relative; z-index: 1;
    width: 100%;
    aspect-ratio: 4 / 5;
    max-height: 62vh;
    border-radius: var(--radius);
    background-image: url("https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=1400&q=80");
    background-size: cover;
    background-position: center;
  }
  /* 赤のシェブロンを写真の肩に */
  .hero__mark {
    position: absolute; z-index: 3;
    top: 4%; right: -3%;
    width: 64px; height: 72px;
    background: var(--color-logo-red);
    clip-path: polygon(0 0, 55% 0, 100% 50%, 55% 100%, 0 100%, 45% 50%);
  }

  @media (prefers-reduced-motion: no-preference) {
    .hero__copy, .hero__lead, .hero__cta, .hero__visual {
      opacity: 0; transform: translateY(18px);
      animation: rise .9s cubic-bezier(.22, 1, .36, 1) forwards;
    }
    .hero__lead   { animation-delay: .12s; }
    .hero__cta    { animation-delay: .24s; }
    .hero__visual { animation-delay: .18s; }
    @keyframes rise { to { opacity: 1; transform: none; } }
  }

  @media (max-width: 767px) {
    .hero { min-height: auto; }
    .hero__inner {
      grid-template-columns: 1fr;
      padding: 108px 24px 56px;
      gap: 44px;
    }
    .hero__copy { font-size: clamp(24px, 6.7vw, 32px); }
    .hero__photo { aspect-ratio: 4 / 3; max-height: none; }
    .header__logo img { height: 28px; }
  }
</style>
</head>
<body>

<header class="header">
  <a class="header__logo" href="#" aria-label="RE DESIGN">
    <img src="../../assets/logo/logo.svg" alt="RE DESIGN" width="333" height="86">
  </a>
</header>

<section class="hero">
  <div class="hero__inner">
    <div>
      <div class="hero__chevrons" aria-hidden="true"><i></i><i></i><i></i></div>
      <h1 class="hero__copy">
        <span>ホームページを、</span><br>
        <span>ただつくるだけではない。</span><br>
        <span class="is-red">事業と集客を、</span><span>ともに考える。</span>
      </h1>
      <div class="hero__lead">
        <p>RE DESIGNは、お客様の事業を理解し、その価値や課題を整理することから始めます。</p>
        <p>誰に、何を伝えるのか。<br>どのような方法で届け、訪れた人をどう問い合わせや商談につなげるのか。</p>
        <p>Web集客全体の流れから逆算し、届けたい人にきちんと伝わるホームページを設計・制作します。</p>
      </div>
      <a class="hero__cta" href="#contact">ホームページ制作について相談する</a>
    </div>

    <div class="hero__visual">
      <div class="hero__photo" role="img" aria-label="画面を指差しながら相談する手元（ダミー写真）"></div>
      <div class="hero__mark" aria-hidden="true"></div>
    </div>
  </div>
</section>

</body>
</html>
