<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>03 現行レイアウトの微調整｜3案</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f2eb;color:#2b2b2b;font-family:"Hiragino Kaku Gothic ProN",sans-serif}header{background:#fff;border-bottom:1px solid #d6d0c5;padding:18px 26px}header strong{font-size:14px}header small{font-size:11px;color:#79736a;margin-left:16px}nav{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}button{font:inherit;font-size:12px;color:#34312c;background:#fff;border:1px solid #c7c0b4;padding:11px 16px;border-radius:3px;cursor:pointer}button[aria-pressed=true]{background:#2b2b2b;color:white;border-color:#2b2b2b}button:focus-visible{outline:3px solid #d93832;outline-offset:3px}.meta{display:flex;justify-content:space-between;align-items:center;padding:16px 26px;gap:15px;border-bottom:1px solid #e0d9cd}.meta p{font-size:12px;line-height:1.8;margin:0}.meta b{color:#bc332d}.size{white-space:nowrap;background:transparent}.viewport{width:100%;overflow:auto}.canvas{position:relative;margin:auto}iframe{border:0;display:block;width:1440px;height:1050px;transform-origin:top left;background:#f5f2eb}.error{padding:30px;color:#b52c25;font-size:14px}footer{padding:18px 26px;font-size:11px;line-height:1.8;color:#7c7569;border-top:1px solid #ded7cc}@media(max-width:600px){header{padding:16px}header small{display:block;margin:9px 0 0}.meta{padding:14px 16px;align-items:flex-start}nav button{padding:10px 12px}}
</style></head><body>
<header><strong>03 / 現行デザインの微調整</strong><small>配置・構成・原稿は現行のまま。本体には未反映。</small><nav aria-label="調整案"><button type="button" data-variant="original" aria-pressed="false">現行と比較</button><button type="button" data-variant="a" aria-pressed="true">A　線と影を整理</button><button type="button" data-variant="b" aria-pressed="false">B　下段を引き立てる</button><button type="button" data-variant="c" aria-pressed="false">C　関与の線を補う</button></nav></header>
<div class="meta"><p id="description" aria-live="polite"><b>A</b>：配置はそのまま。角丸・線幅を控えめにして、設計書の影と揺れを除く。</p><button type="button" class="size" aria-pressed="false">原寸で見る</button></div>
<div class="viewport"><div class="canvas"><iframe title="現行03をベースにしたデザイン比較" sandbox="allow-same-origin"></iframe></div></div>
<footer>現行v15の03を読み込み、右図の見た目だけを上書きしています。左カラム・5工程・上下2段・職種名・設計責任者・設計書・説明文は共通です。<br>A〜Cでは、設計書が揺れ、欠片が落ち続ける動きだけを停止しています。</footer>
<script>
const iframe=document.querySelector('iframe'),canvas=document.querySelector('.canvas'),viewport=document.querySelector('.viewport');
let selected='a',actual=false,ready=false;
const common=`html,body{margin:0!important;overflow:hidden!important}#s5 .rv,#s5 .rv.in{opacity:1!important;transform:none!important;transition:none!important}#s5 .x3__who,#s5 .x3__slot,#s5 .x3__pass{opacity:1!important;transition:none!important}#s5 .x3__owner,#s5 .x3__bar{transform:none!important;transition:none!important}`;
const calm=`#s5 .x3__doc,#s5 .x3__bits i{animation:none!important}#s5 .x3__bits{display:none}#s5 .x3__doc.lv1{filter:none}`;
const variants={
original:'',
a:calm+`#s5 .x3__row::before{border-radius:8px}#s5 .x3__row--b::before{box-shadow:0 0 0 1px var(--accent)}#s5 .x3__who{box-shadow:inset 0 0 0 1px #827c73}#s5 .x3__bar{height:3px}#s5 .x3__doc .d0{stroke-width:2}#s5 .x3__owner{border-radius:5px}#s5 .x3__steps{border-bottom-width:1px}`,
b:calm+`#s5 .x3__row--a::before{background:rgba(255,255,255,.42)}#s5 .x3__row--a .x3__lbl{background:#79746c}#s5 .x3__row--a .x3__who{color:#756f66;box-shadow:inset 0 0 0 1px #b3ab9e;background:transparent}#s5 .x3__row--a .x3__doc{filter:grayscale(.8);opacity:.7}#s5 .x3__row--b::before{background:#fff9f6;box-shadow:0 0 0 1.5px var(--accent)}#s5 .x3__row--b .x3__doc .d0{fill:#fff9f6;stroke:var(--accent);stroke-width:2.5}#s5 .x3__row--b .x3__doc .dl{stroke:var(--accent)}#s5 .x3__bar{height:3px}`,
c:calm+`#s5 .x3__row::before{border-radius:10px}#s5 .x3__row--b::before{box-shadow:0 0 0 1.5px var(--accent)}#s5 .x3__owner{border-radius:5px}#s5 .x3__row--b .x3__slot:before{content:"";position:absolute;left:50%;top:-22px;height:22px;border-left:1.5px solid var(--accent)}#s5 .x3__row--b .x3__slot:after{content:"";position:absolute;left:calc(50% - 3px);top:-3px;width:6px;height:6px;background:var(--accent);border-radius:50%}#s5 .x3__bar{height:3px}#s5 .x3__doc .d0{stroke-width:2}`
};
const descriptions={original:'<b>現行</b>：現在の図をそのまま表示。A〜Cと同じ配置・同じ原稿です。',a:'<b>A</b>：配置はそのまま。角丸・線幅を控えめにして、設計書の影と揺れを除く。',b:'<b>B</b>：上段の色を抑え、下段に淡い赤の面。下段の設計書は赤い線画にする。',c:'<b>C</b>：現在の帯と設計書の間に細い縦線を追加。設計責任者が各工程を見る関係を補う。'};
function fit(){const scale=actual?1:Math.min(1,viewport.clientWidth/1440);canvas.style.width=1440*scale+'px';canvas.style.height=1050*scale+'px';iframe.style.transform=`scale(${scale})`}
function select(key){if(!(key in variants))key='a';selected=key;document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.variant===key)));document.getElementById('description').innerHTML=descriptions[key];if(ready)iframe.contentDocument.getElementById('variant-style').textContent=variants[key];history.replaceState(null,'','#'+key)}
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>select(b.dataset.variant)));
document.querySelector('.size').addEventListener('click',e=>{actual=!actual;e.currentTarget.textContent=actual?'全体に合わせる':'原寸で見る';e.currentTarget.setAttribute('aria-pressed',String(actual));fit()});
window.addEventListener('resize',fit);window.addEventListener('hashchange',()=>select(location.hash.slice(1)));select(location.hash.slice(1)||'a');fit();
(async()=>{try{const response=await fetch('../index.html');if(!response.ok)throw new Error('HTTP '+response.status);const doc=new DOMParser().parseFromString(await response.text(),'text/html');const section=doc.querySelector('#s5');if(!section||!section.querySelector('.x3'))throw new Error('現行03の構造を確認できません');section.querySelectorAll('script').forEach(e=>e.remove());section.querySelectorAll('.rv').forEach(e=>e.classList.add('in'));section.querySelectorAll('.x3__row').forEach(e=>e.classList.add('on'));const styles=[...doc.querySelectorAll('style,link[rel="stylesheet"]')].map(e=>e.outerHTML).join('\n');const base=new URL('../',location.href).href;iframe.addEventListener('load',()=>{ready=true;select(selected);fit()},{once:true});iframe.srcdoc='<!doctype html><html lang="ja"><head><meta charset="utf-8"><base href="'+base+'">'+styles+'<style>'+common+'</style><style id="variant-style">'+variants[selected]+'</style></head><body>'+section.outerHTML+'</body></html>'}catch(error){document.getElementById('description').textContent='プレビューを読み込めませんでした：'+error.message;document.getElementById('description').className='error'}})();
</script></body></html>
