<svg xmlns="http://www.w3.org/2000/svg" width="90" height="90" viewBox="0 0 90 90" fill="none" role="img" aria-label="事業を表す建物。ひとつの窓だけが灯っている">
  <!-- 事業 = 何を提供できるか。窓のひとつだけをアクセント色にして「選ばれる理由」を差す -->
  <g stroke="#2b2b2b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M20 68 H74"/>
    <rect x="24" y="26" width="28" height="42" rx="2"/>
    <rect x="52" y="42" width="18" height="26" rx="2"/>
    <rect x="33" y="56" width="11" height="12" fill="#f4ebd7"/>
  </g>
  <g fill="#2b2b2b">
    <rect x="30" y="33" width="6" height="6"/>
    <rect x="30" y="43" width="6" height="6"/>
    <rect x="40" y="43" width="6" height="6"/>
    <rect x="58" y="49" width="6" height="6"/>
  </g>
  <rect x="40" y="33" width="6" height="6" fill="#d93832"/>
</svg>
