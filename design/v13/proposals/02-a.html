<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>02 Design — A案「関係図」</title>
<!-- セクション02（伝え方・届け方の設計）のデザイン案 A「関係図」。
     01 Discovery（design/v13/index.html #s3）と同じ設計思想：
     中心に赤の核、周囲に sand のノード、7px の sand 線でつなぐ。1440×874。 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@800&family=Noto+Sans+JP:wght@400;700;900&family=Zen+Kaku+Gothic+Antique:wght@900&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#f5f2eb; --black:#2b2b2b; --accent:#d93832;
  --ink-lead:#161c21; --ink-body:#333330; --ink-num:#2a2927;
  --sand:#f4ebd7; --node-bg:#f0e8c9;
  --font-jp:"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;
  --font-disp:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN",sans-serif;
  --font-disp-alt:"Zen Kaku Gothic Antique","Zen Kaku Gothic New","Hiragino Kaku Gothic ProN",sans-serif;
  --font-num:"Manrope",sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--black);font-family:var(--font-jp);
     -webkit-font-smoothing:antialiased;overflow-x:hidden}
h2,p{margin:0}
.accent{color:var(--accent)}
section{position:relative;overflow:clip}

.bigword{position:absolute;font-family:var(--font-disp);font-weight:900;
         font-size:216px;line-height:216px;letter-spacing:-8.64px;
         white-space:nowrap;pointer-events:none;user-select:none}

/* ---- セクション枠（01 と同じ 1440×874 の座標系） ---- */
#s4{background:var(--cream);height:874px;display:flex;justify-content:center}
.frame{position:relative;flex:0 0 auto;width:min(1440px,100%);height:874px}
#s4 .bigword{left:0;top:138px;transform:translateY(-50%);color:rgba(43,43,43,.07)}

/* 外周リング — 01 と同じ位置・同じ値（790 / 131px / sand 40%） */
.halo{position:absolute;left:675px;top:63.41px;width:790px;height:790px;
      border-radius:50%;border:131px solid rgba(244,235,215,.4)}

/* ---- 左カラム（01 と同じ値） ---- */
.head{position:absolute;left:100.8px;top:117px;width:618.7px;display:flex;flex-direction:column;gap:15px}
.eyebrow{display:flex;align-items:center;gap:12.8px;height:53px}
.num{font-family:var(--font-num);font-weight:800;font-size:52px;line-height:52px;letter-spacing:-1.04px;color:var(--ink-num);opacity:.9}
.label{font-weight:700;font-size:16px;letter-spacing:1.56px;color:var(--black)}
.h2{font-family:var(--font-disp-alt);font-weight:900;font-size:44.6px;line-height:66.96px;letter-spacing:.223px;color:var(--black)}
.h2 > .rv{display:block}
.lead{width:553px;font-size:17px;line-height:34px;color:var(--ink-body)}

/* ---- 右カラム: 関係図（570×640。中心 (285,320)、半径230 の六角配置） ---- */
.fig{position:absolute;left:785px;top:138px;width:570px;height:640px}
.fig svg.wire{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.wire line,.wire circle{stroke:var(--sand);fill:none}
.wire line{stroke-width:7}
.wire circle{stroke-width:3}

.core{position:absolute;left:200px;top:235px;width:170px;height:170px;border-radius:50%;
      background:var(--accent);box-shadow:inset 0 0 0 11px #fff;
      display:flex;align-items:center;justify-content:center}
.core span{font-family:var(--font-disp);font-weight:900;font-size:25px;line-height:25px;
           letter-spacing:.223px;color:#fff;white-space:nowrap}

.node{position:absolute;width:170px;height:205px}
.node__bg{position:absolute;left:0;top:35px;width:170px;height:170px;border-radius:50%;background:var(--node-bg)}
.node__ring{position:absolute;left:40px;top:0;width:90px;height:90px;border-radius:50%;background:#fff;
            display:flex;align-items:center;justify-content:center}
.node__ring svg{width:44px;height:44px;fill:none;stroke:var(--black);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.node__name{position:absolute;left:0;top:115px;width:100%;transform:translateY(-50%);text-align:center;
            font-family:var(--font-disp);font-weight:900;font-size:20px;line-height:25px;letter-spacing:.223px;color:var(--black);white-space:nowrap}
.node__note{position:absolute;left:15px;top:157px;width:140px;transform:translateY(-50%);
            font-size:13px;line-height:19.5px;text-align:center;color:#000}

/* ---- 動き（01 と同じ .rv ＋ 線描画） ---- */
@media (prefers-reduced-motion:no-preference){
  .rv{opacity:0;transform:translateY(18px);transition:opacity .8s ease,transform .8s cubic-bezier(.22,1,.36,1);transition-delay:calc(var(--i,0) * .12s)}
  .rv.in{opacity:1;transform:none}
  .wire line,.wire circle{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1s cubic-bezier(.4,0,.2,1)}
  .fig.on .wire line,.fig.on .wire circle{stroke-dashoffset:0}
  .wire line:nth-of-type(2){transition-delay:.1s}
  .wire line:nth-of-type(3){transition-delay:.2s}
  .wire line:nth-of-type(4){transition-delay:.3s}
  .wire line:nth-of-type(5){transition-delay:.4s}
  .wire line:nth-of-type(6){transition-delay:.5s}
  .wire circle{transition-delay:.9s;transition-duration:1.4s}
  .grp{opacity:0;transform:translateY(14px);transition:opacity .55s ease-out,transform .55s cubic-bezier(.22,1,.36,1)}
  .fig.on .grp{opacity:1;transform:none;transition-delay:var(--d,0s)}
}
@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none}}
</style>
</head>
<body>

<section id="s4" data-screen-label="04 Design（02 伝え方・届け方の設計）">
  <div class="frame">
    <span class="bigword rv" style="--i:0" aria-hidden="true">Design</span>
    <div class="halo" aria-hidden="true"></div>

    <div class="head">
      <div class="eyebrow rv" style="--i:1">
        <span class="num">02</span>
        <span class="label">伝え方・届け方の設計</span>
      </div>
      <h2 class="h2">
        <span class="rv" style="--i:2">事業の価値を、</span>
        <span class="rv" style="--i:3"><span class="accent">届くかたち</span>へ</span>
      </h2>
      <p class="lead rv" style="--i:4">誰に、何を伝えるべきかを整理をしたうえで、どうやって伝えるかを設計することで、はじめてホームページをどうやって作るべきかが見えてきます。</p>
    </div>

    <!-- 関係図: 中心「事業の価値」から6要素へ放射。ノード中心を通る細い円で「取り囲む」関係を補う -->
    <div class="fig" role="img" aria-label="事業の価値を中心に、言葉・写真・デザイン・ページ構成・映像・集客計測の6要素が取り囲む図">
      <svg class="wire" viewBox="0 0 570 640" aria-hidden="true">
        <circle pathLength="1" cx="285" cy="320" r="230"/>
        <line pathLength="1" x1="285" y1="320" x2="285"   y2="90"/>
        <line pathLength="1" x1="285" y1="320" x2="484.2" y2="205"/>
        <line pathLength="1" x1="285" y1="320" x2="484.2" y2="435"/>
        <line pathLength="1" x1="285" y1="320" x2="285"   y2="550"/>
        <line pathLength="1" x1="285" y1="320" x2="85.8"  y2="435"/>
        <line pathLength="1" x1="285" y1="320" x2="85.8"  y2="205"/>
      </svg>

      <!-- 1 言葉（上） -->
      <div class="node grp" style="left:200px;top:-30px;--d:.7s">
        <span class="node__bg"></span>
        <span class="node__ring"><svg viewBox="0 0 48 48"><path d="M8 9h32a4 4 0 0 1 4 4v15a4 4 0 0 1-4 4H21l-9 7v-7H8a4 4 0 0 1-4-4V13a4 4 0 0 1 4-4z"/><path d="M14 19h20M14 26h13"/></svg></span>
        <span class="node__name">言葉</span>
        <p class="node__note">顧客の課題と、事業の価値が伝わる原稿</p>
      </div>
      <!-- 2 写真（右上） -->
      <div class="node grp" style="left:399.2px;top:85px;--d:.82s">
        <span class="node__bg"></span>
        <span class="node__ring"><svg viewBox="0 0 48 48"><rect x="5" y="13" width="38" height="27" rx="4"/><circle cx="24" cy="26" r="7"/><path d="M17 13l3-5h8l3 5"/><circle cx="36" cy="19" r="1.6" fill="#2b2b2b" stroke="none"/></svg></span>
        <span class="node__name">写真</span>
        <p class="node__note">サービスの信頼と空気感を伝えるビジュアル</p>
      </div>
      <!-- 3 デザイン（右下） -->
      <div class="node grp" style="left:399.2px;top:315px;--d:.94s">
        <span class="node__bg"></span>
        <span class="node__ring"><svg viewBox="0 0 48 48"><rect x="6" y="6" width="22" height="22" rx="2"/><circle cx="31" cy="31" r="11"/><path d="M6 42l8-8"/></svg></span>
        <span class="node__name">デザイン</span>
        <p class="node__note">迷わず理解でき、印象に残る見せ方</p>
      </div>
      <!-- 4 ページ構成（下） -->
      <div class="node grp" style="left:200px;top:430px;--d:1.06s">
        <span class="node__bg"></span>
        <span class="node__ring"><svg viewBox="0 0 48 48"><rect x="6" y="6" width="36" height="36" rx="3"/><path d="M6 15h36M18 15v27M24 24h12M24 31h12"/></svg></span>
        <span class="node__name">ページ構成</span>
        <p class="node__note">知りたい情報へ自然に進める情報設計</p>
      </div>
      <!-- 5 映像（左下） -->
      <div class="node grp" style="left:.8px;top:315px;--d:1.18s">
        <span class="node__bg"></span>
        <span class="node__ring"><svg viewBox="0 0 48 48"><rect x="5" y="10" width="38" height="28" rx="4"/><path d="M20 17v14l12-7z" fill="#2b2b2b" stroke="none"/></svg></span>
        <span class="node__name">映像</span>
        <p class="node__note">サービスの雰囲気や動きを伝えるモーション</p>
      </div>
      <!-- 6 集客・計測（左上） -->
      <div class="node grp" style="left:.8px;top:85px;--d:1.3s">
        <span class="node__bg"></span>
        <span class="node__ring"><svg viewBox="0 0 48 48"><path d="M6 42h36"/><rect x="10" y="28" width="6" height="14"/><rect x="21" y="20" width="6" height="22"/><rect x="32" y="12" width="6" height="30"/><path d="M8 20l11-8 9 5 12-10"/><path d="M33 7h7v7"/></svg></span>
        <span class="node__name">集客・計測</span>
        <p class="node__note">広告や解析まで見据えた公開後の設計</p>
      </div>

      <div class="core grp" style="--d:.15s"><span>事業の価値</span></div>
    </div>
  </div>
</section>

<script>
(function () {
  var items = document.querySelectorAll('.rv, .fig');
  var show = function (el) { el.classList.add(el.classList.contains('fig') ? 'on' : 'in'); };
  if (!('IntersectionObserver' in window)) { items.forEach(show); return; }
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) { if (!e.isIntersecting) return; show(e.target); io.unobserve(e.target); });
  }, { rootMargin: '0px 0px -8% 0px', threshold: 0.05 });
  items.forEach(function (el) { io.observe(el); });
})();
</script>
</body>
</html>
