<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>frame</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Zen+Kaku+Gothic+New:wght@700;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden}
body{background:#0051aa;display:grid;place-content:center;font-family:"Noto Sans JP",sans-serif}
svg{width:1200px;height:975px;display:block}

</style>
</head>
<body>
<svg viewBox="0 0 640 520" role="img" aria-label="入口からホームページ、問い合わせまでの設計図">
        <!-- ① 入口 -->
        <text x="10" y="26" font-family="'JetBrains Mono',monospace" font-weight="700" font-size="14" fill="#ff9b8d" letter-spacing="1">① 届け方の設計</text>
        <g font-family="'Noto Sans JP',sans-serif" font-size="13.5" font-weight="700" fill="#2b2b2b">
          <rect x="10" y="42" width="128" height="40" fill="#fcfcfc"/><text x="30" y="67">検索（SEO）</text>
          <rect x="152" y="42" width="150" height="40" fill="#fcfcfc"/><text x="168" y="67">リスティング広告</text>
          <rect x="316" y="42" width="80" height="40" fill="#fcfcfc"/><text x="340" y="67">SNS</text>
          <rect x="410" y="42" width="80" height="40" fill="#fcfcfc"/><text x="430" y="67">紹介</text>
        </g>
        <g stroke="rgba(255,255,255,.6)" stroke-width="2" fill="none">
          <path d="M74 82v34l120 30"/><path d="M227 82v34l-15 28"/><path d="M356 82v34l-100 28"/><path d="M450 82v34l-175 30"/>
        </g>
        <!-- ② ホームページ -->
        <text x="10" y="170" font-family="'JetBrains Mono',monospace" font-weight="700" font-size="14" fill="#ff9b8d" letter-spacing="1">② 伝え方の設計</text>
        <rect x="120" y="186" width="290" height="228" fill="#fcfcfc"/>
        <rect x="120" y="186" width="290" height="26" fill="#e2e8f0"/>
        <circle cx="136" cy="199" r="4" fill="#b9c6d8"/><circle cx="150" cy="199" r="4" fill="#b9c6d8"/>
        <g font-family="'Noto Sans JP',sans-serif" font-size="13" font-weight="700" fill="#2b2b2b">
          <rect x="140" y="228" width="250" height="44" fill="#f0ede4"/><text x="154" y="254">ページ構成 — 見せる順番</text>
          <rect x="140" y="282" width="250" height="44" fill="#f0ede4"/><text x="154" y="308">原稿 — 伝わる言葉</text>
          <rect x="140" y="336" width="250" height="44" fill="#f0ede4"/><text x="154" y="362">写真・デザイン — 信頼される見た目</text>
        </g>
        <text x="430" y="300" font-family="'Zen Kaku Gothic New',sans-serif" font-weight="900" font-size="17" fill="#fff">ホームページ</text>
        <path d="M424 292l-8 6" stroke="#fff" stroke-width="1.6"/>
        <!-- ③ 出口 -->
        <path d="M265 414v30" stroke="rgba(255,255,255,.6)" stroke-width="2.4"/>
        <path d="M257 436l8 10 8-10" fill="none" stroke="rgba(255,255,255,.6)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="10" y="460" font-family="'JetBrains Mono',monospace" font-weight="700" font-size="14" fill="#ff9b8d" letter-spacing="1">③ 導線の設計</text>
        <rect x="170" y="470" width="190" height="46" fill="#d93832"/>
        <text x="204" y="499" font-family="'Zen Kaku Gothic New',sans-serif" font-weight="900" font-size="17" fill="#fff">問い合わせへ</text>
        <text x="380" y="499" font-family="'Noto Sans JP',sans-serif" font-size="12.5" fill="rgba(255,255,255,.85)">導線・フォーム・計測まで設計</text>
      </svg>
</body>
</html>
