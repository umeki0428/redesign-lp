<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ページが見つかりません｜RE DESIGN</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#d93832">
<meta name="format-detection" content="telephone=no">
<script src="/tracking.js"></script>
<meta name="robots" content="noindex">
<!-- [§74・§111] 404 ページ。サーバー側で「見つからないときは 404.html を返す」設定が要る（DESIGN.md §74）。
     見た目はトップ（C案）と同じヘッダー・フッター。深い階層の URL で返されても壊れないよう、リンクと素材はルートからの絶対パス（ローカルでは http://127.0.0.1:8137/dist/ の下では表示が崩れる） -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Noto+Sans+JP:wght@500;700;900&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Noto+Sans+JP:wght@500;700;900&amp;display=swap" media="print" onload="this.media='all'">   <!-- フォントの CSS で描画を止めない（読めたら有効にする）[§124] -->
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Noto+Sans+JP:wght@500;700;900&amp;display=swap"></noscript>
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
<!-- Google Tag Manager (noscript)：JavaScript が無効な環境向け [§72] -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-MBWHWBVQ"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

<header class="hd">
  <a href="/" class="hd__home" aria-label="RE DESIGN トップページ"><img class="hd__logo" src="/assets/logo-wide.svg" width="144" height="22" alt="RE DESIGN"></a>
  <a class="hd__back" href="/">トップページへ戻る</a>
</header>

<main class="pg">
  <div class="pg__wrap">
    <p class="ttl__en">404 NOT FOUND</p>
    <h1>お探しのページは、<br>見つかりませんでした。</h1>
    <p class="pg__lead">URLが変わったか、ページが削除された可能性があります。<br>お手数ですが、トップページからご覧ください。</p>
    <div class="pg__note">
      <p>ホームページ制作やリニューアルのご相談は、トップページのお問い合わせフォームから受け付けています。ご提案までは無料です。</p>
    </div>
    <p class="pg__act"><a href="/" class="btn btn--lg">トップページへ戻る<span class="btn__arr" aria-hidden="true"></span></a></p>
  </div>
</main>

<footer class="ft ft--sub">
  <div class="wrap ft__in">
    <div class="ft__logo"><img src="/assets/logo-wide.svg" alt="RE DESIGN" width="144" height="22"><p>RE DESIGN合同会社</p></div>
    <p class="ft__copy"><a href="/privacy.html">プライバシーポリシー</a><span>© RE DESIGN. All rights reserved.</span></p>
  </div>
</footer>

</body>
</html>
